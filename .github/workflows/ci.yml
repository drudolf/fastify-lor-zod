name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    container: node:${{ matrix.node-version }}-alpine
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - run: apk add --no-cache tar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-node${{ matrix.node-version }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node${{ matrix.node-version }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm knip
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node-version == 24
        with:
          name: coverage
          path: coverage/coverage-summary.json
      - run: pnpm test:spec-check
      - name: Enforce no todo tests on main
        if: github.ref == 'refs/heads/main'
        run: pnpm test:spec-check --strict

  peer-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { peer: fastify, version: '5.7.0' } # lowest supported (>=5.7.0 <6)
          - { peer: fastify, version: '5' } # latest 5.x
          - { peer: fast-json-stringify, version: '6.0.0' } # lowest supported (>=6.0.0 <8)
          - { peer: fast-json-stringify, version: '7' } # latest 7.x
          - { peer: '@fastify/swagger', version: '9.7.0' } # lowest supported (>=9.7.0 <10)
          - { peer: '@fastify/swagger', version: '9' } # latest 9.x
    container: node:24-alpine
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - run: apk add --no-cache tar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - name: Pin ${{ matrix.peer }}@${{ matrix.version }}
        run: pnpm add -D ${{ matrix.peer }}@${{ matrix.version }}
      - run: pnpm typecheck
      - run: pnpm test

  ci-status:
    needs: [ci, peer-compat]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: >-
          contains(needs.ci.result, 'failure') || contains(needs.ci.result, 'cancelled') ||
          contains(needs.peer-compat.result, 'failure') || contains(needs.peer-compat.result, 'cancelled')

  coverage-report:
    needs: ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - uses: davelosert/vitest-coverage-report-action@2500dafcee7dd64f85ab689c0b83798a8359770e # v2
        with:
          json-summary-path: coverage-summary.json
